name: Test project

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Set up MySQL
        run: |
          sudo systemctl start mysql
          mysql -e 'CREATE DATABASE redcraft' -uroot -proot

      - name: Checkout code
        uses: actions/checkout@v5

      # Laravel 13 wants 8.3 or newer and is tested through 8.5, which is what
      # the FrankenPHP image runs, so CI matches production rather than
      # whatever is oldest that still works.
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          tools: composer:v2
          extensions: sqlite3, intl, gd, zip, redis, bcmath, pcntl

      # install, not update. Composer blocks spiral/roadrunner over
      # CVE-2025-22871 when it resolves from scratch, and resolving on every run
      # meant CI never tested the versions production actually ships.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Use default .env
        run: cp .env.testing .env

      - name: clear cache
        run: php artisan config:clear

      - name: Generate key
        run: php artisan key:generate

      - name: Apply migrations on local database
        run: php artisan migrate

      - name: Run tests
        run: |
          cp .env .env.testing
          php artisan test

      # The front end has its own suite now, because the one regression that
      # reached staging was a javascript evaluation order problem that every
      # php test and every status code check happily reported as fine.
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      # Builds first because one of the tests loads the compiled stylesheets in
      # the order the page emits them, to check a page file has not started
      # overriding a utility class that Alpine toggles.
      - name: Run front end tests
        run: |
          npm ci
          npm run build
          npm test
