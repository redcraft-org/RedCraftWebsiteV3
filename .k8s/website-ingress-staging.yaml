apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: redcraft-website
  namespace: staging
spec:
  ingressClassName: nginx
  # No tls block, matching production. The proxy in front holds the real
  # certificate and speaks plain http to the node port, so a tls block here only
  # makes ingress-nginx apply its default ssl-redirect and bounce every request
  # back to https, which the proxy then forwards as http again. That loop is why
  # staging.redcraft.org answered 308 to itself.
  rules:
    - host: staging.redcraft.org
      http:
        paths:
          - backend:
              service:
                name: website
                port:
                  number: 80
            pathType: ImplementationSpecific
            path: /
